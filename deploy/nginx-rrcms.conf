# RR-CMS behind nginx, with TLS.
#
#   cp deploy/nginx-rrcms.conf /etc/nginx/sites-available/rrcms
#   ln -s /etc/nginx/sites-available/rrcms /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS IS NOT OPTIONAL HERE, and not only for the usual reasons. Browsers refuse
# camera access over plain http, so screening photographs, the daily joint
# checklist photographs and the signed feedback page all stop working the day
# this is reached over http:// on the Railway network.

server {
    listen 80;
    listen [::]:80;
    server_name rrcms.example.railnet.gov.in;      # <-- change

    # Certbot's challenge, then everything else to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rrcms.example.railnet.gov.in;      # <-- change

    ssl_certificate     /etc/letsencrypt/live/rrcms.example.railnet.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rrcms.example.railnet.gov.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # A screening document photographed on a phone is routinely several MB, and
    # the daily joint checklist can carry one per clause. The application allows
    # 20 MB a file; nginx must not refuse it first with a bare 413.
    client_max_body_size 32m;

    # Security headers. The application sets none itself, deliberately — it may
    # be mounted inside CRTMS one day, and a mounted router that fights its host
    # over headers is worse than one that sets none.
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "same-origin"    always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The crew feedback form is deliberately public — it is reached from a QR
    # poster by a driver with no login. Everything else is behind the session.
    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The application sets `trust proxy` and reads this to record the real
        # address against a login and an audit row. Without it every audit entry
        # says 127.0.0.1.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/rrcms.access.log;
    error_log  /var/log/nginx/rrcms.error.log;
}
