# RR-CMS inside the EXISTING crtms.in server block.
#
# This is not a whole server block. Paste it into the `server { ... }` for
# crtms.in that already carries `location /counselling/` and `location /`,
# ABOVE the `location / { proxy_pass http://localhost:3000; }` line.
#
#   sudo nano /etc/nginx/sites-available/<the crtms.in site file>
#   sudo nginx -t && sudo systemctl reload nginx
#
# Nothing else in that file changes. `client_max_body_size 50M` is already set
# on the server and covers photographs taken on a phone.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE ONE THING THAT WILL CATCH YOU
#
# The neighbouring block reads:
#
#     location /counselling/ { proxy_pass http://127.0.0.1:5003/; }
#                                                               ^ trailing slash
#
# That trailing slash makes nginx STRIP /counselling/ before forwarding, so the
# Python application never sees the prefix. RR-CMS is the opposite: it runs with
# APP_BASE_PATH=/rrcms and mounts its own router at that path, so the prefix has
# to arrive intact — every link, form action, stylesheet and QR code it
# generates already carries it.
#
# Copy the neighbouring pattern and every page 404s.
# ─────────────────────────────────────────────────────────────────────────────

location /rrcms {
    proxy_pass         http://127.0.0.1:3100;      # NO trailing slash
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The application sets `trust proxy` and reads this to record the real
    # address against a login and against every audit row. Without it the audit
    # trail says 127.0.0.1 for every action ever taken.
    proxy_set_header   X-Forwarded-Proto $scheme;

    # A scanned six-page police verification or a daily checklist carrying a
    # photograph per clause takes longer than the default.
    proxy_read_timeout 120s;
}
